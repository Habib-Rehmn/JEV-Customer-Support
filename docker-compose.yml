services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jev}
      POSTGRES_DB: ${POSTGRES_DB:-jev_support}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jev} -d ${POSTGRES_DB:-jev_support}"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jev}:${POSTGRES_PASSWORD:-jev}@postgres:5432/${POSTGRES_DB:-jev_support}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
